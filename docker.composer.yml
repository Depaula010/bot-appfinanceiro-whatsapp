services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-bot
    restart: always
    ports:
      - "3000:3000"
    networks:
      - rede-global
    environment:
      - NODE_ENV=production
      - PORT=3000
      # A URL agora aponta para o postgres-central (definido no seu .env)
      - DATABASE_URL=${DATABASE_URL}
      - DB_SSL=${DB_SSL:-false}
      - ADMIN_WHATSAPP_NUMBER=${ADMIN_WHATSAPP_NUMBER}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - WEBHOOK_SIGNATURE_KEY=${WEBHOOK_SIGNATURE_KEY}
      - PYTHON_API_URL=${PYTHON_API_URL:-http://meu-secretario-api:8000}

# A rede global é necessária para ele "ver" o postgres-central
networks:
  rede-global:
    external: true